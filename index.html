<body>

    <script type="module">
        import * as THREE from "three";

        const COLORS = {
            belt: 0x161b12,
            beltTop: 0x1e2417,
            chevron: 0x2c341f,
            frame: 0x3f4a2f,
            paper: 0xe7ebdd,
            lime: 0xcbf01c,
            vermilion: 0xd43a20,
            ink: 0x0d0f0b,
        };

        const TONES = {
            queued: { face: COLORS.paper, text: COLORS.ink },
            processing: { face: COLORS.vermilion, text: COLORS.paper },
            ready: { face: COLORS.lime, text: COLORS.ink },
        };

        const LANES = [
            { key: "queued", label: "ANTREAN", x: -3.7 },
            { key: "processing", label: "DAPUR", x: 0 },
            { key: "ready", label: "AMBIL", x: 3.7 },
        ];

        const BLOCK_SIZE = 1.25;
        const BLOCK_Y = 0.25 + BLOCK_SIZE / 2;
        const PARALLAX_X = 0.7;
        const PARALLAX_Y = 0.35;
        const stages = new Set();

        function tint(hex) {
            return `#${hex.toString(16).padStart(6, "0")}`;
        }

        function canvasOf(width, height) {
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            return canvas;
        }

        function numberTexture(number, tone) {
            const size = 256;
            const canvas = canvasOf(size, size);
            const ctx = canvas.getContext("2d");
            const face = tint(tone.face);
            const text = tint(tone.text);
            ctx.fillStyle = face;
            ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = text;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 6;
            ctx.strokeRect(12, 12, size - 24, size - 24);
            ctx.globalAlpha = 1;
            ctx.fillStyle = text;
            ctx.font = "700 104px 'Space Mono', ui-monospace, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(number, size / 2, size / 2 + 4);
            ctx.fillRect(40, size - 46, size - 80, 10);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = 4;
            return texture;
        }

        function labelTexture(label) {
            const canvas = canvasOf(512, 128);
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, 512, 128);
            ctx.fillStyle = tint(COLORS.paper);
            ctx.font = "700 54px 'Space Mono', ui-monospace, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, 256, 66);
            ctx.fillStyle = tint(COLORS.lime);
            ctx.fillRect(76, 108, 360, 8);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = 4;
            return texture;
        }

        function beltTexture() {
            const canvas = canvasOf(256, 128);
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = tint(COLORS.beltTop);
            ctx.fillRect(0, 0, 256, 128);
            ctx.strokeStyle = tint(COLORS.chevron);
            ctx.lineWidth = 14;
            ctx.lineCap = "square";
            for (let x = -64; x < 320; x += 64) {
                ctx.beginPath();
                ctx.moveTo(x, 24);
                ctx.lineTo(x + 32, 64);
                ctx.lineTo(x, 104);
                ctx.stroke();
            }
            ctx.fillStyle = tint(COLORS.frame);
            ctx.fillRect(0, 0, 256, 6);
            ctx.fillRect(0, 122, 256, 6);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.repeat.set(6, 1);
            texture.anisotropy = 4;
            return texture;
        }

        function makeStage(host, options) {
            const settings = options || {};
            const compact = host.clientWidth < 620;
            const queuedCap = compact ? 2 : 3;
            const readyCap = compact ? 2 : 3;

            let renderer;
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            } catch (error) {
                return null;
            }

            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.domElement.setAttribute("aria-hidden", "true");
            renderer.domElement.classList.add("stage__canvas");
            host.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 80);
            camera.position.set(0, 3.35, 9.3);

            const belt = beltTexture();
            const beltBody = new THREE.MeshStandardMaterial({ color: COLORS.belt, roughness: 0.85 });
            const beltTop = new THREE.MeshStandardMaterial({ map: belt, roughness: 0.7 });
            const beltMesh = new THREE.Mesh(
                new THREE.BoxGeometry(15, 0.5, 3),
                [beltBody, beltBody, beltTop, beltBody, beltBody, beltBody]
            );
            beltMesh.position.y = 0;
            scene.add(beltMesh);

            const frameMaterial = new THREE.MeshStandardMaterial({ color: COLORS.frame, roughness: 0.6 });
            const postGeometry = new THREE.BoxGeometry(0.14, 2.6, 0.14);
            const beamGeometry = new THREE.BoxGeometry(0.16, 0.16, 3.05);
            const labelGeometry = new THREE.PlaneGeometry(2.7, 0.68);

            const laneLabels = [];

            LANES.forEach((lane) => {
                [-1.3, 1.3].forEach((z) => {
                    const post = new THREE.Mesh(postGeometry, frameMaterial);
                    post.position.set(lane.x, 1.3, z);
                    scene.add(post);
                });
                const beam = new THREE.Mesh(beamGeometry, frameMaterial);
                beam.position.set(lane.x, 2.62, 0);
                scene.add(beam);

                const map = labelTexture(lane.label);
                const label = new THREE.Mesh(
                    labelGeometry,
                    new THREE.MeshBasicMaterial({ map, transparent: true })
                );
                label.position.set(lane.x, 2.2, 0.02);
                scene.add(label);
                laneLabels.push(label);
            });

            const blockGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            const blocks = new Map();
            const sideMaterial = new THREE.MeshStandardMaterial({ color: COLORS.paper, roughness: 0.55 });
            const blocksInUse = new Set();

            scene.add(new THREE.HemisphereLight(0xf2f6e2, 0x12160d, 1.05));
            const key = new THREE.DirectionalLight(0xffffff, 2.1);
            key.position.set(5, 8, 6);
            scene.add(key);
            const fill = new THREE.DirectionalLight(0xffffff, 0.55);
            fill.position.set(-6, 4, -6);
            scene.add(fill);

            function materialsFor(number, tone) {
                const palette = TONES[tone] || TONES.queued;
                const face = new THREE.MeshStandardMaterial({ map: numberTexture(number, palette), roughness: 0.5 });
                return [sideMaterial, sideMaterial, sideMaterial, sideMaterial, face, sideMaterial];
            }

            function releaseBlock(block) {
                scene.remove(block.mesh);
                block.mesh.material[4].map.dispose();
                block.mesh.material[4].dispose();
            }

            function ensureBlock(order, tone) {
                let block = blocks.get(order.id);
                if (!block) {
                    block = {
                        mesh: new THREE.Mesh(blockGeometry, materialsFor(order.number, tone)),
                        tone,
                        number: order.number,
                        x: LANES[0].x - 1.7,
                        targetX: LANES[0].x - 1.7,
                        phase: Math.random() * Math.PI * 2,
                        spawn: 0,
                        exit: 1,
                        active: true,
                    };
                    block.mesh.position.set(block.x, BLOCK_Y, 0);
                    block.mesh.scale.setScalar(0.05);
                    scene.add(block.mesh);
                    blocks.set(order.id, block);
                    return block;
                }
                if (block.tone !== tone || block.number !== order.number) {
                    const previous = block.mesh.material[4];
                    block.mesh.material = materialsFor(order.number, tone);
                    previous.map.dispose();
                    previous.dispose();
                    block.tone = tone;
                    block.number = order.number;
                }
                return block;
            }

            function place(list, start, direction, cap, step) {
                list.slice(0, cap).forEach((order, index) => {
                    const block = ensureBlock(order, order.tone);
                    block.active = true;
                    block.exit = 1;
                    block.targetX = start + direction * index * step;
                    blocksInUse.add(order.id);
                });
            }

            function sync(board) {
                blocksInUse.clear();
                blocks.forEach((block) => {
                    block.active = false;
                });
                place(board.queued || [], LANES[0].x + 0.85, -1, queuedCap, 1.35);
                place(board.processing || [], LANES[1].x, -1, 2, 1.6);
                place(board.ready || [], LANES[2].x + 0.15, 1, readyCap, 1.35);
            }

            const pointer = { x: 0, y: 0, has: false };
            const sway = { x: 0, y: 0 };
            let clock = 0;
            let last = performance.now();
            let raf = 0;
            let live = true;
            let visible = true;

            function onPointer(event) {
                const rect = host.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
                pointer.has = true;
            }

            host.addEventListener("pointermove", onPointer);
            host.addEventListener("pointerleave", () => {
                pointer.has = false;
            });

            function resize() {
                const width = host.clientWidth;
                const height = host.clientHeight;
                if (!width || !height) return;
                renderer.setSize(width, height, false);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }

            const resizeObserver = new ResizeObserver(resize);
            resizeObserver.observe(host);
            resize();

            const freeze = SC.motion.reduced;

            function update(dt) {
                clock += dt;
                belt.offset.x -= dt * 0.07;

                const targetSwayX = pointer.has ? pointer.x * PARALLAX_X : Math.sin(clock * 0.22) * 0.45;
                const targetSwayY = pointer.has ? pointer.y * PARALLAX_Y : 0;
                sway.x += (targetSwayX - sway.x) * Math.min(1, dt * 2.4);
                sway.y += (targetSwayY - sway.y) * Math.min(1, dt * 2.4);

                blocks.forEach((block, id) => {
                    if (!block.active) {
                        block.exit = Math.max(0, block.exit - dt * 2.6);
                        if (block.exit <= 0) {
                            releaseBlock(block);
                            blocks.delete(id);
                            return;
                        }
                    } else {
                        block.spawn = Math.min(1, block.spawn + dt * 3.2);
                    }

                    block.x += (block.targetX - block.x) * Math.min(1, dt * 4.4);
                    const grow = block.spawn * block.spawn * (3 - 2 * block.spawn);
                    const shrink = block.exit * block.exit * (3 - 2 * block.exit);
                    const scale = Math.max(0.001, grow * shrink);
                    const bob = Math.sin(clock * 2 + block.phase) * 0.045;
                    const tilt = THREE.MathUtils.clamp((block.targetX - block.x) * -0.09, -0.22, 0.22);

                    block.mesh.position.set(block.x, BLOCK_Y + bob, 0);
                    block.mesh.scale.setScalar(scale);
                    block.mesh.rotation.y = Math.sin(clock * 0.9 + block.phase) * 0.1;
                    block.mesh.rotation.z = tilt;
                });

                if (blocksInUse.size) {
                    const focus = blocks.get(Array.from(blocksInUse)[0]);
                    if (focus && focus.active) {
                        focus.mesh.scale.multiplyScalar(1 + Math.sin(clock * 3.4) * 0.012);
                    }
                }

                camera.position.x = sway.x;
                camera.position.y = 3.35 - sway.y;
                camera.lookAt(0, BLOCK_Y + 0.25, 0);
            }

            function loop(now) {
                raf = window.requestAnimationFrame(loop);
                const dt = Math.min(0.06, (now - last) / 1000);
                last = now;
                if (!live || !visible) return;
                update(dt);
                renderer.render(scene, camera);
            }

            if (freeze) {
                update(0);
                renderer.render(scene, camera);
            } else {
                raf = window.requestAnimationFrame(loop);
            }

            const visibility = new IntersectionObserver(
                (entries) => {
                    visible = entries.some((entry) => entry.isIntersecting);
                    last = performance.now();
                },
                { threshold: 0.02 }
            );
            visibility.observe(host);

            function onHidden() {
                live = !document.hidden;
                last = performance.now();
            }

            document.addEventListener("visibilitychange", onHidden);

            function destroy() {
                window.cancelAnimationFrame(raf);
                resizeObserver.disconnect();
                visibility.disconnect();
                document.removeEventListener("visibilitychange", onHidden);
                host.removeEventListener("pointermove", onPointer);
                blocks.forEach((block) => releaseBlock(block));
                blocks.clear();
                laneLabels.forEach((label) => label.material.map.dispose());
                belt.dispose();
                beltBody.dispose();
                beltTop.dispose();
                frameMaterial.dispose();
                sideMaterial.dispose();
                postGeometry.dispose();
                beamGeometry.dispose();
                labelGeometry.dispose();
                blockGeometry.dispose();
                renderer.dispose();
                stages.delete(stage);
                if (renderer.domElement.parentNode === host) host.removeChild(renderer.domElement);
            }

            const stage = { sync, destroy, renderer, scene, camera, blocks, host };
            stages.add(stage);
            return stage;
        }

        window.SC3D = {
            version: THREE.REVISION,
            stages,
            mountFifo(host, options) {
                if (!host) return null;
                try {
                    return makeStage(host, options);
                } catch (error) {
                    window.console.warn("scene gagal dimuat", error);
                    return null;
                }
            },
        };

        window.dispatchEvent(new Event("sc3d:ready"));
    </script>
